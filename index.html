<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Capricorn OS Command Deck V9 — V4 Intelligence Ready</title>

<style>
:root{
  --cyan:#00eaff;
  --gold:#ffe27a;
  --green:#00ffbf;
  --red:#ff4747;
  --blue:#3ea6ff;
  --white:#e8f5ff;
  --core:var(--gold);
  --soft:rgba(255,226,122,.22);
  --glow:rgba(255,226,122,.88);
}

*{box-sizing:border-box}

html,body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  background:transparent;
  font-family:Arial,Helvetica,sans-serif;
}

#app{
  position:relative;
  width:100%;
  height:100vh;
  min-height:540px;
  display:grid;
  place-items:center;
  overflow:hidden;
  color:white;
  background:
    radial-gradient(circle at 50% 50%, var(--soft), transparent 34%),
    radial-gradient(circle at 50% 18%, rgba(0,234,255,.2), transparent 32%),
    linear-gradient(145deg,#020714,#04182e,#01030a);
}

.claimant-observer{--core:#3ea6ff;--soft:rgba(62,166,255,.22);--glow:rgba(62,166,255,.8)}
.claimant-participant{--core:#00eaff;--soft:rgba(0,234,255,.22);--glow:rgba(0,234,255,.8)}
.claimant-active{--core:#00ffbf;--soft:rgba(0,255,191,.22);--glow:rgba(0,255,191,.8)}
.claimant-verified{--core:#ffe27a;--soft:rgba(255,226,122,.22);--glow:rgba(255,226,122,.88)}
.claimant-advanced{--core:#e8f5ff;--soft:rgba(232,245,255,.24);--glow:rgba(232,245,255,.9)}
.claimant-command{--core:#fff4c7;--soft:rgba(255,244,199,.3);--glow:rgba(255,244,199,1)}
.claimant-alert{--core:#ff4747;--soft:rgba(255,71,71,.24);--glow:rgba(255,71,71,.85)}

.health-excellent{--core:#fff4c7;--soft:rgba(255,244,199,.32);--glow:rgba(255,244,199,1)}
.health-strong{--core:#00ffbf;--soft:rgba(0,255,191,.26);--glow:rgba(0,255,191,.9)}
.health-stable{--core:#ffe27a;--soft:rgba(255,226,122,.24);--glow:rgba(255,226,122,.88)}
.health-weak{--core:#ffb347;--soft:rgba(255,179,71,.24);--glow:rgba(255,179,71,.82)}
.health-critical{--core:#ff4747;--soft:rgba(255,71,71,.25);--glow:rgba(255,71,71,.88)}

.layer{
  position:absolute;
  inset:0;
  pointer-events:none;
}

.stars{
  background-image:
    radial-gradient(circle,rgba(255,255,255,.95) 1px,transparent 2px),
    radial-gradient(circle,rgba(0,234,255,.75) 1px,transparent 2px);
  background-size:32px 32px,78px 78px;
  opacity:.28;
  animation:stars 46s linear infinite;
}

.grid{
  opacity:.15;
  background:
    linear-gradient(rgba(0,234,255,.2) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,234,255,.2) 1px,transparent 1px);
  background-size:54px 54px;
}

.scan{
  height:230px;
  background:linear-gradient(180deg,transparent,rgba(0,234,255,.17),transparent);
  animation:scanMove 6s linear infinite;
}

.event-active .scan{animation-duration:3.2s}

.fog{
  background:
    radial-gradient(circle at 18% 25%,rgba(0,234,255,.12),transparent 28%),
    radial-gradient(circle at 82% 62%,var(--soft),transparent 38%);
  animation:fog 8s ease-in-out infinite;
}

.core-wrap{
  position:relative;
  width:720px;
  height:720px;
  display:grid;
  place-items:center;
}

.ring{
  position:absolute;
  border-radius:50%;
  border:1px solid var(--core);
  box-shadow:0 0 28px var(--soft), inset 0 0 24px rgba(0,234,255,.08);
}

.r1{width:310px;height:310px;animation:spin 10s linear infinite}
.r2{width:415px;height:415px;border-style:dashed;opacity:.78;animation:spinReverse 18s linear infinite}
.r3{width:535px;height:535px;border-color:rgba(0,234,255,.42);animation:spin 32s linear infinite}
.r4{width:660px;height:660px;border-style:dashed;border-color:rgba(255,255,255,.16);animation:spinReverse 52s linear infinite}

.galaxy-active .r1,
.galaxy-active .r2,
.galaxy-active .r3{
  box-shadow:0 0 34px var(--soft), inset 0 0 30px rgba(0,234,255,.16);
}

.orb{
  position:relative;
  width:340px;
  height:340px;
  border-radius:50%;
  display:grid;
  place-items:center;
  border:2px solid var(--core);
  background:
    radial-gradient(circle,var(--soft),rgba(0,234,255,.09) 48%,rgba(0,0,0,.24) 75%);
  box-shadow:
    0 0 90px var(--soft),
    0 0 145px rgba(0,234,255,.32),
    inset 0 0 90px var(--soft);
  overflow:hidden;
  animation:breathe 3.2s ease-in-out infinite;
  z-index:10;
}

.mission-active .orb{animation:breathe 2.1s ease-in-out infinite}

.orb:before,.orb:after{
  content:"";
  position:absolute;
  inset:22px;
  border-radius:50%;
  border:1px solid var(--core);
  opacity:.38;
}

.orb:before{transform:rotate(20deg) scaleX(.72);animation:innerA 7s linear infinite}
.orb:after{transform:rotate(-20deg) scaleY(.72);animation:innerB 11s linear infinite}

.logo{
  position:relative;
  z-index:5;
  width:230px;
  height:230px;
  object-fit:contain;
  filter:drop-shadow(0 0 24px var(--core)) drop-shadow(0 0 60px rgba(0,234,255,.42));
  animation:logoPulse 2.6s ease-in-out infinite;
}

.holo{
  position:absolute;
  inset:0;
  background:linear-gradient(180deg,transparent,rgba(0,234,255,.2),transparent);
  animation:holo 2.7s linear infinite;
  z-index:7;
}

.glass{
  position:absolute;
  inset:0;
  z-index:8;
  background:
    linear-gradient(120deg,transparent,rgba(255,255,255,.09),transparent),
    radial-gradient(circle at 50% 40%,transparent 40%,rgba(0,0,0,.3) 90%);
}

.platform{
  position:absolute;
  bottom:58px;
  width:390px;
  height:78px;
  border-radius:50%;
  border:2px solid rgba(0,234,255,.42);
  box-shadow:0 0 48px rgba(0,234,255,.45), inset 0 0 34px var(--soft);
  transform:rotateX(70deg);
  animation:pulsePlatform 2.4s ease-in-out infinite;
}

.galaxy-lines{
  position:absolute;
  width:720px;
  height:720px;
  inset:0;
  z-index:13;
  pointer-events:none;
  overflow:visible;
}

.galaxy-line{
  stroke:rgba(0,234,255,.32);
  stroke-width:1.4;
  stroke-linecap:round;
  stroke-dasharray:8 10;
  filter:drop-shadow(0 0 7px rgba(0,234,255,.65));
  animation:lineFlow 4.2s linear infinite;
}

.galaxy-line.primary{
  stroke:var(--core);
  stroke-width:2.6;
  stroke-dasharray:10 8;
  filter:drop-shadow(0 0 10px var(--glow));
  animation:lineFlow 1.8s linear infinite;
}

.galaxy-line.warning{
  stroke:var(--gold);
  filter:drop-shadow(0 0 8px rgba(255,226,122,.7));
}

.galaxy-line.alert{
  stroke:var(--red);
  filter:drop-shadow(0 0 10px rgba(255,71,71,.8));
}

.command-halo{
  position:absolute;
  width:610px;
  height:610px;
  border-radius:50%;
  animation:haloDrift 20s linear infinite;
  z-index:15;
}

.node{
  position:absolute;
  width:82px;
  height:82px;
  border-radius:50%;
  border:1px solid var(--core);
  background:rgba(1,10,24,.72);
  color:white;
  display:grid;
  place-items:center;
  text-align:center;
  cursor:pointer;
  box-shadow:0 0 22px var(--soft), inset 0 0 18px rgba(0,234,255,.09);
  backdrop-filter:blur(8px);
  transition:.22s ease;
  letter-spacing:1px;
  animation:nodePulse 3.4s ease-in-out infinite;
}

.node.empty{
  opacity:.52;
  filter:grayscale(.45);
  border-color:rgba(255,255,255,.25);
}

.node.live{
  border-color:var(--green);
  box-shadow:0 0 28px rgba(0,255,191,.38), inset 0 0 20px rgba(0,255,191,.12);
}

.node.warn{
  border-color:var(--gold);
}

.node.alert{
  border-color:var(--red);
  box-shadow:0 0 34px rgba(255,71,71,.55), inset 0 0 20px rgba(255,71,71,.16);
}

.node.path{
  transform:scale(1.12);
  border-color:var(--core);
  box-shadow:0 0 44px var(--glow),0 0 90px rgba(0,234,255,.35),inset 0 0 28px var(--soft);
}

.galaxy-active .node.live{animation-duration:1.8s}

.mission-active .node.warn,
.health-weak .node.warn,
.health-critical .node.warn{
  animation:nodeAlert 1.2s ease-in-out infinite;
}

.node strong{
  display:block;
  color:var(--core);
  font-size:10px;
  line-height:1;
}

.node span{
  display:block;
  margin-top:5px;
  font-size:10px;
  color:#e9fcff;
}

.node:hover{
  transform:scale(1.16);
  box-shadow:0 0 38px var(--glow),0 0 80px rgba(0,234,255,.35),inset 0 0 26px var(--soft);
}

.n-qfn{left:50%;top:0;transform:translate(-50%,-50%)}
.n-vault{right:55px;top:88px}
.n-timeline{right:-34px;top:50%;transform:translateY(-50%)}
.n-cert{right:55px;bottom:88px}
.n-reports{left:50%;bottom:0;transform:translate(-50%,50%)}
.n-learning{left:55px;bottom:88px}
.n-mi8{left:-34px;top:50%;transform:translateY(-50%)}
.n-dossier{left:55px;top:88px}

.n-qfn:hover{transform:translate(-50%,-50%) scale(1.16)}
.n-timeline:hover,.n-mi8:hover{transform:translateY(-50%) scale(1.16)}
.n-reports:hover{transform:translate(-50%,50%) scale(1.16)}

.tooltip{
  position:absolute;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  width:410px;
  min-height:62px;
  padding:12px 18px;
  border-radius:18px;
  border:1px solid rgba(0,234,255,.35);
  background:rgba(0,0,0,.58);
  color:#e9fcff;
  text-align:center;
  opacity:0;
  transition:.2s ease;
  box-shadow:0 0 30px rgba(0,234,255,.2);
  backdrop-filter:blur(12px);
  z-index:30;
}

.tooltip.active{opacity:1;bottom:28px}
.tooltip strong{display:block;color:var(--core);letter-spacing:2px;margin-bottom:5px}
.tooltip span{font-size:12px;line-height:1.45}

.status{
  position:absolute;
  bottom:4px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:10px;
  padding:8px 14px;
  border-radius:999px;
  border:1px solid rgba(0,234,255,.28);
  background:rgba(0,0,0,.52);
  color:#e9fcff;
  font-size:10px;
  z-index:40;
}

.status strong{color:var(--core)}

.mode-speaking .logo{animation:talk .45s ease-in-out infinite}
.mode-speaking .r1,.mode-speaking .r2,.mode-speaking .r3{animation-duration:3s;border-color:var(--green)}
.mode-listening .r1,.mode-listening .r2{border-color:var(--cyan);box-shadow:0 0 44px rgba(0,234,255,.75)}
.mode-thinking .r1,.mode-thinking .r2,.mode-thinking .r3{animation-duration:4s}
.mode-error .orb,.mode-error .ring{border-color:var(--red)}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinReverse{to{transform:rotate(-360deg)}}
@keyframes innerA{from{transform:rotate(20deg) scaleX(.72)}to{transform:rotate(380deg) scaleX(.72)}}
@keyframes innerB{from{transform:rotate(-20deg) scaleY(.72)}to{transform:rotate(-380deg) scaleY(.72)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
@keyframes logoPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.058)}}
@keyframes talk{0%,100%{transform:scale(1)}50%{transform:scale(1.13)}}
@keyframes holo{from{transform:translateY(-100%)}to{transform:translateY(100%)}}
@keyframes pulsePlatform{0%,100%{transform:rotateX(70deg) scale(.95)}50%{transform:rotateX(70deg) scale(1.06)}}
@keyframes haloDrift{from{filter:drop-shadow(0 0 14px var(--soft))}50%{filter:drop-shadow(0 0 32px var(--glow))}to{filter:drop-shadow(0 0 14px var(--soft))}}
@keyframes nodePulse{0%,100%{box-shadow:0 0 18px var(--soft), inset 0 0 16px rgba(0,234,255,.08)}50%{box-shadow:0 0 34px var(--soft), inset 0 0 24px rgba(0,234,255,.16)}}
@keyframes nodeAlert{0%,100%{box-shadow:0 0 18px rgba(255,226,122,.28),inset 0 0 16px rgba(255,226,122,.08)}50%{box-shadow:0 0 42px rgba(255,71,71,.58),inset 0 0 26px rgba(255,71,71,.2)}}
@keyframes lineFlow{to{stroke-dashoffset:-90}}
@keyframes stars{from{background-position:0 0,0 0}to{background-position:600px 600px,-500px 420px}}
@keyframes scanMove{from{transform:translateY(-240px)}to{transform:translateY(1000px)}}
@keyframes fog{0%,100%{transform:translateX(0)}50%{transform:translateX(18px)}}

@media(max-width:700px){
  .core-wrap{width:100%;height:100vh}
  .galaxy-lines{width:100%;height:100%}
  .command-halo{width:390px;height:390px}
  .node{width:60px;height:60px}
  .node strong{font-size:8px}
  .node span{font-size:8px}
  .orb{width:245px;height:245px}
  .logo{width:165px;height:165px}
  .r3,.r4{display:none}
  .tooltip{display:none}
  .status{width:calc(100% - 20px);justify-content:center;flex-wrap:wrap;border-radius:16px}
}
</style>
<link rel="stylesheet" href="capricorn-v3.css" />
</head>

<body>
<main id="app" class="mode-idle claimant-verified">
  <div class="layer stars"></div>
  <div class="layer grid"></div>
  <div class="layer scan"></div>
  <div class="layer fog"></div>

  <section class="core-wrap" id="coreWrap">
    <svg id="galaxyLines" class="galaxy-lines" viewBox="0 0 720 720"></svg>

    <div class="ring r1"></div>
    <div class="ring r2"></div>
    <div class="ring r3"></div>
    <div class="ring r4"></div>

    <div class="command-halo">
      <button class="node n-qfn" data-module="QFN"><div><strong>QFN</strong><span id="qfn">--</span></div></button>
      <button class="node n-vault" data-module="VAULT"><div><strong>VAULT</strong><span id="vault">--</span></div></button>
      <button class="node n-timeline" data-module="TIMELINE"><div><strong>TIME</strong><span id="timeline">--</span></div></button>
      <button class="node n-cert" data-module="CERTIFICATES"><div><strong>CERT</strong><span id="cert">--</span></div></button>
      <button class="node n-reports" data-module="REPORTS"><div><strong>REPORT</strong><span id="reports">--</span></div></button>
      <button class="node n-learning" data-module="LEARNING"><div><strong>LEARN</strong><span id="learning">--</span></div></button>
      <button class="node n-mi8" data-module="MI8"><div><strong>MI8</strong><span id="mi8">--</span></div></button>
      <button class="node n-dossier" data-module="DOSSIER"><div><strong>DOSSIER</strong><span id="dossier">READY</span></div></button>
    </div>

    <div class="platform"></div>

    <div class="orb">
      <img class="logo" src="https://static.wixstatic.com/media/c1955d_404918e0c6ca4c8b8b8ac8680b004761~mv2.png" />
      <div class="holo"></div>
      <div class="glass"></div>
    </div>

    <div id="tooltip" class="tooltip">
      <strong id="tipTitle">CAPRICORN</strong>
      <span id="tipBody">Command Deck Ready.</span>
    </div>

    <div class="status">
      <div><strong>STATUS:</strong> <span id="statusText">ONLINE</span></div>
      <div><strong>VOICE:</strong> <span id="voiceText">READY</span></div>
      <div><strong>MEMORY:</strong> <span id="memoryText">ONLINE</span></div>
      <div><strong>MODE:</strong> <span id="modeText">CORE</span></div>
      <div><strong>INTELLIGENCE:</strong> <span id="intelligenceText">AWAITING V4</span></div>
    </div>
  </section>
</main>

<script>
const app = document.getElementById("app");
const statusText = document.getElementById("statusText");
const modeText = document.getElementById("modeText");
const memoryText = document.getElementById("memoryText");
const galaxyLines = document.getElementById("galaxyLines");

const nodes = {
  QFN: document.getElementById("qfn"),
  VAULT: document.getElementById("vault"),
  TIMELINE: document.getElementById("timeline"),
  CERTIFICATES: document.getElementById("cert"),
  REPORTS: document.getElementById("reports"),
  LEARNING: document.getElementById("learning"),
  MI8: document.getElementById("mi8"),
  DOSSIER: document.getElementById("dossier")
};

const buttonNodes = {
  QFN: document.querySelector('[data-module="QFN"]'),
  VAULT: document.querySelector('[data-module="VAULT"]'),
  TIMELINE: document.querySelector('[data-module="TIMELINE"]'),
  CERTIFICATES: document.querySelector('[data-module="CERTIFICATES"]'),
  REPORTS: document.querySelector('[data-module="REPORTS"]'),
  LEARNING: document.querySelector('[data-module="LEARNING"]'),
  MI8: document.querySelector('[data-module="MI8"]'),
  DOSSIER: document.querySelector('[data-module="DOSSIER"]')
};

const pointMap = {
  CLAIMANT: { x: 360, y: 360 },
  QFN: { x: 360, y: 55 },
  VAULT: { x: 565, y: 145 },
  TIMELINE: { x: 665, y: 360 },
  CERTIFICATES: { x: 565, y: 575 },
  REPORTS: { x: 360, y: 665 },
  LEARNING: { x: 155, y: 575 },
  MI8: { x: 55, y: 360 },
  DOSSIER: { x: 155, y: 145 }
};

const moduleAliases = {
  claimant: "CLAIMANT",
  qfn: "QFN",
  vault: "VAULT",
  reports: "REPORTS",
  certificates: "CERTIFICATES",
  timeline: "TIMELINE",
  learning: "LEARNING",
  mi8: "MI8",
  dossier: "DOSSIER",
  serviceRequests: "DOSSIER",
  memory: "DOSSIER",
  goals: "DOSSIER",
  site: "DOSSIER"
};

const tooltip = document.getElementById("tooltip");
const tipTitle = document.getElementById("tipTitle");
const tipBody = document.getElementById("tipBody");

let deck = {};

function clean(v,f="--"){
  return v===undefined||v===null||v===""?f:String(v);
}

function numeric(v){
  const n = Number(v);
  return Number.isFinite(n) ? n : 0;
}

function moduleKey(value){
  return moduleAliases[String(value || "").trim()] || moduleAliases[String(value || "").trim().toLowerCase()] || String(value || "").toUpperCase();
}

function clearPathNodes(){
  Object.values(buttonNodes).forEach(btn=>{
    if(btn) btn.classList.remove("path");
  });
}

function setLiveState(module, value){
  const node = buttonNodes[module];
  if(!node) return;

  node.classList.remove("live","empty","warn","alert");

  if(module === "DOSSIER"){
    node.classList.add("live");
    return;
  }

  if(module === "QFN"){
    const active = String(value || "").toLowerCase();
    if(active.includes("active") || active.includes("ready") || active.includes("verified") || active.includes("approved")) node.classList.add("live");
    else if(active.includes("pending") || active.includes("not")) node.classList.add("warn");
    else node.classList.add("empty");
    return;
  }

  if(numeric(value) > 0) node.classList.add("live");
  else node.classList.add("empty");
}

function drawLine(fromKey,toKey,cls=""){
  const from = pointMap[fromKey];
  const to = pointMap[toKey];
  if(!from || !to || !galaxyLines) return;

  const line = document.createElementNS("http://www.w3.org/2000/svg","line");
  line.setAttribute("x1",from.x);
  line.setAttribute("y1",from.y);
  line.setAttribute("x2",to.x);
  line.setAttribute("y2",to.y);
  line.setAttribute("class",`galaxy-line ${cls}`.trim());
  galaxyLines.appendChild(line);
}

function drawGalaxyLines(data={}){
  if(!galaxyLines) return;

  galaxyLines.innerHTML = "";

  const baseLinks = [
    ["CLAIMANT","QFN"],
    ["CLAIMANT","VAULT"],
    ["CLAIMANT","TIMELINE"],
    ["CLAIMANT","CERTIFICATES"],
    ["CLAIMANT","REPORTS"],
    ["CLAIMANT","LEARNING"],
    ["CLAIMANT","MI8"],
    ["CLAIMANT","DOSSIER"],
    ["VAULT","REPORTS"],
    ["LEARNING","CERTIFICATES"],
    ["TIMELINE","REPORTS"],
    ["QFN","DOSSIER"]
  ];

  baseLinks.forEach(([from,to])=>drawLine(from,to));

  const primary = String(data.primaryMission || data.recommendedAction || "").toLowerCase();

  if(primary.includes("qfn") || primary.includes("kyc")) drawLine("CLAIMANT","QFN","primary");
  if(primary.includes("vault")) drawLine("CLAIMANT","VAULT","primary");
  if(primary.includes("report")) {
    drawLine("CLAIMANT","REPORTS","primary");
    drawLine("VAULT","REPORTS","primary");
  }
  if(primary.includes("certificate")) {
    drawLine("CLAIMANT","CERTIFICATES","primary");
    drawLine("LEARNING","CERTIFICATES","primary");
  }
  if(primary.includes("timeline")) drawLine("CLAIMANT","TIMELINE","primary");
  if(primary.includes("learn")) drawLine("CLAIMANT","LEARNING","primary");
  if(primary.includes("mi8")) drawLine("CLAIMANT","MI8","primary");

  if(numeric(data.platformHealth) < 55){
    drawLine("CLAIMANT","DOSSIER","alert");
  } else if(numeric(data.platformHealth) < 75){
    drawLine("CLAIMANT","DOSSIER","warning");
  }
}

function setMode(mode="idle", label=""){
  app.classList.remove("mode-idle","mode-speaking","mode-listening","mode-thinking","mode-error","mode-success","mode-verified");
  app.classList.add("mode-"+mode);

  statusText.textContent =
    mode==="speaking"?"SPEAKING":
    mode==="listening"?"LISTENING":
    mode==="thinking"?"THINKING":
    mode==="error"?"ERROR":
    mode==="verified"?"ONLINE":"READY";

  modeText.textContent = label || mode.toUpperCase();
}

function setClass(data={}){
  const v = String(data.claimantLevel || data.status || "Observer").toLowerCase();

  app.classList.remove(
    "claimant-observer",
    "claimant-participant",
    "claimant-active",
    "claimant-verified",
    "claimant-advanced",
    "claimant-command",
    "claimant-alert"
  );

  let c="claimant-observer";

  if(v.includes("alert")||v.includes("risk")||v.includes("critical")) c="claimant-alert";
  else if(v.includes("command")||v.includes("chief")||v.includes("root")||v.includes("excellent")) c="claimant-command";
  else if(v.includes("advanced")||v.includes("ultimate")||v.includes("strong")) c="claimant-advanced";
  else if(v.includes("verified")||v.includes("stable")) c="claimant-verified";
  else if(v.includes("active")) c="claimant-active";
  else if(v.includes("participant")) c="claimant-participant";

  app.classList.add(c);
}

 // V4 results are accepted only when the backend supplies its real version marker.
 // V4 is a read-only member-scoped pilot; it does not measure full platform uptime.
 function getV4Payload(value){
   if(!value || typeof value !== "object") return null;
   const candidates = [value, value.intelligenceV4, value.capricornIntelligenceV4,
     value.v4, value.context?.intelligenceV4, value.context?.capricornIntelligenceV4];
   return candidates.find(x => x && typeof x === "object" &&
     x.version === "4.0.0-pilot" && (x.code === "READY" || x.code === "PARTIAL_DATA")) || null;
 }

 function applyV4(value){
   const v4 = getV4Payload(value);
   if(!v4) return false;
   v4State = v4;
   intelligenceText.textContent = v4.code === "READY" ? "V4 PILOT READY" : "V4 PARTIAL DATA";
   intelligenceText.title = `Capricorn Intelligence ${v4.version} — ${v4.mode || "READ_ONLY"}`;
   const counts = {};
   (Array.isArray(v4.modules) ? v4.modules : []).forEach(m => {
     if(m?.status === "QUERY_OK" && Number.isFinite(m.recordCount)) counts[m.id] = m.recordCount;
   });
   // Update only fields V4 actually knows. No inferred MI8 status or fabricated health percentage.
   const replacements = { vault:"VAULT", timeline:"TIMELINE", certificates:"CERTIFICATES",
     reports:"REPORTS", learning:"LEARNING" };
   Object.entries(replacements).forEach(([id,key]) => {
     if(Object.prototype.hasOwnProperty.call(counts,id)) {
       nodes[key].textContent = String(counts[id]);
       setLiveState(key, counts[id]);
     }
   });
   if(Object.prototype.hasOwnProperty.call(counts,"qfn")) {
     nodes.QFN.textContent = String(counts.qfn);
     const btn = buttonNodes.QFN;
     btn?.classList.remove("live","empty","warn","alert");
     btn?.classList.add(counts.qfn > 0 ? "live" : "empty");
   }
   memoryText.textContent = "MEMBER-SCOPED · READ ONLY";
   modeText.textContent = "INTELLIGENCE V4";
   nodes.MI8.textContent = "--";
   nodes.DOSSIER.textContent = "V4";
   drawGalaxyLines({});
   if(v4.code === "PARTIAL_DATA") statusText.textContent = "PARTIAL DATA";
   else if(statusText.textContent === "PARTIAL DATA") statusText.textContent = "READY";
   return true;
 }

function info(module){
  return module === "MI8"
    ? "MI8 is not part of the V4 read-only pilot."
    : module === "DOSSIER"
      ? "Capricorn Intelligence V4 · member-scoped diagnostics."
      : "V4 module. Counts display when authorised data is received.";
}

document.querySelectorAll(".node").forEach(btn=>{
  btn.addEventListener("mouseenter",()=>{
    const m=btn.dataset.module;
    tipTitle.textContent=m;
    tipBody.textContent=info(m);
    tooltip.classList.add("active");
  });

  btn.addEventListener("mouseleave",()=>{
    tooltip.classList.remove("active");
  });

  btn.addEventListener("click",()=>{
    const m=btn.dataset.module;
    window.parent.postMessage({type:"capricorn:moduleClick",module:m},"*");
    setMode("thinking","OPENING "+m);
  });
});

window.addEventListener("message",event=>{
  const msg=event.data||{};

  if(msg.type==="capricorn:setMode") setMode(msg.mode,msg.label);
  if(msg.type==="capricorn:setClaimantClass") setClass(msg);
  // Legacy V2 command-deck payloads intentionally ignored.
  if(msg.type==="capricorn:setIntelligenceV4" || msg.type==="capricorn:v4" ||
     msg.type==="capricorn:setContext") applyV4(msg.data||msg.result||msg.context||{});
});

drawGalaxyLines({});
setMode("idle","WAITING FOR V4");
intelligenceText.textContent = "V4 CONNECTING";
</script>
