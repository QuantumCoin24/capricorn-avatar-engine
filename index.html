<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Capricorn Avatar Engine V3</title>
  <link rel="stylesheet" href="./style.css"/>
</head>
<body>
  <main id="capricorn-avatar-app" class="mode-idle">
    <div class="starfield"></div>
    <div class="scanline"></div>

    <section class="avatar-shell">
      <div class="halo halo-1"></div>
      <div class="halo halo-2"></div>
      <div class="halo halo-3"></div>

      <div class="avatar-card">
        <div class="avatar-crop">
          <img
            class="human-avatar"
            src="https://static.wixstatic.com/media/c1955d_c3fb79f32ca844e0be08076d7aefae59~mv2.png"
            alt="Capricorn holographic avatar"
          />
          <div class="avatar-mask"></div>
          <div class="eye-glow eye-glow-left"></div>
          <div class="eye-glow eye-glow-right"></div>
          <div class="mouth-light"></div>
          <div class="chest-light"></div>
          <div class="holo-scan"></div>
        </div>
      </div>

      <div class="waveform" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
      </div>

      <div id="statusText" class="status-text">CAPRICORN IDLE</div>
    </section>
  </main>

  <script src="./avatar.js"></script>
</body>
</html>
